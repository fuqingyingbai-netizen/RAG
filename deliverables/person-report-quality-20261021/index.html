E0\" data-side=\"wang-after\" href=\"#wang-after-E-P5DF76EB9256FE0\">[E-P5DF76EB9256FE0]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福，安徽省 芜湖 市无为县人，1987年毕业于中南大学冶金物理化学专业，同年进入北京 有色金属 研究总院攻读硕士，1990年毕业后留院工作，1995年辞职，创办比亚迪公司。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：教育事件原文日期：1987年；教育事件原文日期：1990年；创办事件原文日期：1995年。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-PF002CADA83D57D\" data-side=\"wang-after\" href=\"#wang-after-E-PF002CADA83D57D\">[E-PF002CADA83D57D]<\/a><\/strong><\/p>\n<blockquote>\n<p>此后，王传福一路苦读，1987年本科毕业后，又进入北京有色金属研究总院读研究生，专研电池。1990年毕业，然后留院工作。之后一个偶然机会，他被单位派到深圳某电池公司担任总经理。深圳由此成了王传福的福地，在这里他看到一个大商机：彼时“大哥大”风靡市场，而里面的一块小小电池价格不菲。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：教育事件原文日期：1987年；教育事件原文日期：1990年。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-P226A9D4F0F9AF9\" data-side=\"wang-after\" href=\"#wang-after-E-P226A9D4F0F9AF9\">[E-P226A9D4F0F9AF9]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福先生，1966年出生，中国国籍，硕士研究生学历，正高级工程师、国务院特殊津贴专家，担任联合国“可持续发展顾问委员会”创始成员、“十三五”、“十四五”、“十五五”国家发展规划专家委员会委员等社会职务。王先生于一九八七年毕业于中南工业大学（现为中南大学），主修冶金物理化学，获学士学位；并于一九九零年毕业于北京有色金属研究总院，主修冶金物理化学，获硕士学位。王先生历任北京有色金属研究总院三零一室副主任、深圳市比格电池有限公司总经理，并于一九九五年二月与吕向阳先生共同注册成立深圳市比亚迪实业有限公司（“比亚迪实业”，于二零零二年六月十一日变更为比亚迪股份有限公司）任总经理；现任比亚迪股份有限公司董事长、执行董事兼总裁，负责比亚迪股份有限公司一般营运及制定比亚迪股份有限公司各项业务策略，并担任比亚迪电子（国际）有限公司的非执行董事及主席、比亚迪半导体股份有限公司董事长、深圳腾势新能源汽车有限公司董事长。王先生入选二零二四《时代》周刊全球最具影响力100人、二零二四和二零二五年《财富》全球最具影响力的100位商界领袖，并连续五年进入“福布斯中国最佳CEO”榜单。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：教育事件原文日期：一九八七年；教育事件原文日期：一九九零年。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源称其1990年毕业后留北京有色金属研究总院工作（职务表述不一），后任深圳比格电池总经理；1995年2月与吕向阳创办比亚迪实业任总经理，并任董事长、执行董事兼总裁，负责一般营运及业务策略。 <a class=\"eid\" data-eid=\"E-P70F6B72FAF8DAF\" data-side=\"wang-after\" href=\"#wang-after-E-P70F6B72FAF8DAF\">[E-P70F6B72FAF8DAF]<\/a> <a class=\"eid\" data-eid=\"E-P5DF76EB9256FE0\" data-side=\"wang-after\" href=\"#wang-after-E-P5DF76EB9256FE0\">[E-P5DF76EB9256FE0]<\/a> <a class=\"eid\" data-eid=\"E-PF002CADA83D57D\" data-side=\"wang-after\" href=\"#wang-after-E-PF002CADA83D57D 8DCA\">[E-P0346CED10F8DCA]<\/a><\/strong><\/p>\n<blockquote>\n<p>--- PDF page 44 ---\n比亚迪股份有限公司                               首次公开发行 A股股票招股说明书\n1-1-43\n径净利润的 3.40%、3.05%及 2.65%，上述税收优惠均已计入当期非经常性损益。\n对此，本公司实际控制人王传福已出具承诺函，承诺：“如果税务机关在任何时\n候认定公司及其上述下属公司享受的深圳特区的企业所得税税收优惠不合法，要\n求补缴企业所得税，本人将全额承担上述应补缴的税款及其滞纳金、罚款（如有）\n等，并放弃对公司及上述下属公司的追索权，保证公司及上述下属公司不会因此\n遭受任何损失。”\n本公司的下属子公司北京比亚迪模具在 2008 年享受模具产品增值税先征后\n退 50%的税收优惠；本公司\n、上海比亚迪电动车、比亚迪汽车研发中心、北京比\n德创展、深圳比亚迪通讯技术、深圳比亚迪汽车、深圳比亚迪微电子、比亚迪锂\n电池均对各自的技术转让享受一定额度的免征营业税税收优惠。\n2010 年度、2009 年度及 2008 年度，本集团享受的所得税税收优惠分别增加\n本公司合并报表口径净利润 501,029千元、884,194 千元及 371,476 千元，分别占\n当期合并报表口径净利润的 17.17%、21.68%及 29.12% 。\n2010 年度、2009 年度及 2008 年度，本集团的财政补贴分别为 353,679 千元、\n389,623 千元及 359,098 千元，分别占当期合并报表口径净利润的 12.12%、9.55%\n及 28.15% 。\n若本集团无法继续享受上述税收优惠政策和财政补贴，将会对本集团的财务\n状况和经营业绩产生一定的不利影响。\n（四）国家出口政策变化的风险\n报告期内，本集团的二次充电电池、手机部件和组装业务部分产品享受增值\n税出口退税。2003 年至 2007 年，我国相继颁布《财政部国家税务总局关于调\n整出口货物退税率的通知》(财税[2003]222 号)、《国务院关税税则委员会关于调\n整部分商品出口暂定税率的通知》（税委会[2006]30 号）、《国务院关税税则委员\n会关于调整部分商品进出口暂定税率的通知》等一系列政策，调低部分出口产品\n的退税率，上述政策对本集团主要出口产品报告期内的退税率没有产生影响。\n2008 年以来，为促进出口的增长，缓解出口企业的经营压力，我国多次提\n高商品的退税率。2008 年 11 月 17 日，财政部与国家税务总局联合发布了《关\n于提高劳动密集型产品等商品增值税出口退税率的通知》（财税[2008]144 号），<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　王传福 <a class=\"eid\" data-eid=\"E-P7C2D95D58AA98F\" data-side=\"wang-after\" href=\"#wang-after-E-P7C2D95D58AA98F\">[E-P7C2D95D58AA98F]<\/a><\/strong><\/p>\n<blockquote>\n<p>2026-06-10 压力拉满！王传福放言“五年后做到全球第一”背后：比亚迪追平丰田每年销量增幅需达约20%<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-P3FB7C39CF90492\" data-side=\"wang-after\" href=\"#wang-after-E-P3FB7C39CF90492\">[E-P3FB7C39CF90492]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福表示，在合资品牌围追堵截的巨大压力下，比亚迪敢于打破垄断、打破观念，终结硕果，两款产品在节油性、高扭矩领域做到了领先，2.0TI涡轮增压发动机拥有151kW的最大功率及320N.m的峰值扭矩。生产装配线虽然没有全部使用 机械 手，但关键工序都采用了 机械 手。他预计，有了这款发动机和变速箱，比亚迪的品质将更上一层楼。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-P1A510EA9 ><\/p>\n<blockquote>\n<p>王传福投入比亚迪实业的无形资产为其自行研发并掌握的非专利技术成果， 主要包括镍电池等各种电池材料的研究、开发、生产技术资料和一定的经营管理 技术。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-P37B3320DF334D5\" data-side=\"wang-before\" href=\"#wang-before-E-P37B3320DF334D5\">[E-P37B3320DF334D5]<\/a><\/strong><\/p>\n<blockquote>\n<p>2000 年 1 月 25 日，深圳市丽达斯贸易有限公司和王传福签署权益赠与协议，深圳市丽达 斯贸易有限公司将上述转增资本中可获得的 46.67 万股权无偿赠与王传福。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：契约/权益事项原文日期：2000 年 1 月 25 日。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-PEF1502E6644A56\" data-side=\"wang-before\" href=\"#wang-before-E-PEF1502E6644A56\">[E-PEF1502E6644A56]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福 以无形资产和现金增资 639.5 万元(无形资产增资 600 万元，货币资金增资 39.5 万元)，其中王传福用于增资的无形资产已经深圳中鹏会计师事务所评估并于 1997 年 11月 12 日出具了《资产评估报告书》 （深中会资评字[1997]第 037 号）， 根据该评估报告，王传福拟投入的非专利技术市场价值评估结果为 626.8769 万 元；<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 5　王传福 <a class=\"eid\" data-eid=\"E-P70A4FE260BB020\" data-side=\"wang-before\" href=\"#wang-before-E-P70A4FE260BB020\">[E-P70A4FE260BB020]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福先生目前担任本公司董事长、执行董事、总裁，负责本集团一般营运及制定本集团各项业务策略。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 6　王传福 <a class=\"eid\" data-eid=\"E-P6F067DA25913ED\" data-side=\"wang-before\" href=\"#wang-before-E-P6F067DA25913ED\">[E-P6F067DA25913ED]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福 董事长、执行董事、总裁 深圳比亚迪戴姆勒新技术有限公司 董事 本公司合营企业 比亚迪慈善基金会 理事 无关联关系<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 7　王传福 <a class=\"eid\" data-eid=\"E-PE962DF2C07676C\" data-side=\"wang-before\" href=\"#wang-before-E-PE962DF2C07676C\">[E-PE962DF2C07676C]<\/a><\/strong><\/p>\n<blockquote>\n<p>此外，王传福宣布比亚迪设立30亿慈善基金计划，聚焦教育慈善，在全国多所高校设立奖学金，并向全国中职以上的院校、博物馆和科技馆捐赠新能源解剖车作为科普展具，激发学生们对汽车技术和工业智造的兴趣，助力培养更多卓越的工程师。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 8　王传福 <a class=\"eid\" data-eid=\"E-P659B0615D86FD3\" data-side=\"wang-before\" href=\"#wang-before-E-P659B0615D86FD3\">[E-P659B0615D86FD3]<\/a><\/strong><\/p>\n<blockquote>\n<p>看似人生迥异的郭台铭和王传福其实还有很多相似之处：他们都出身贫寒，皆为白手起家，又都抓住机遇以技术创业取得成功，除了计算机代工、汽车制造外，比亚迪的业务架构和富士康近乎相同———如此多的相似性，并没有带来英雄惺惺相惜的喜乐会结局。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 9　王传福 <a class=\"eid\" data-eid=\"E-PFE0170990EEB8C\" data-side=\"wang-before\" href=\"#wang-before-E-PFE0170990EEB8C\">[E-PFE0170990EEB8C]<\/a><\/strong><\/p>\n<blockquote>\n<p>发布会上，比亚迪股份有限公司董事长兼总裁王传福首次讲述比亚迪30年创业经历，从30年前小厂房里20人的创业团队，凭着“敢想、敢干、敢坚持”的工程师精神，发展到如今近百万名员工的世界级企业，比亚迪坚持用技术创新满足人们对美好生活的向往，并用实际行动回馈社会各界、车主和员工的支持。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 10　王传福 <a class=\"eid\" data-eid=\"E-P70F6B72FAF8DAF\" data-side=\"wang-before\" href=\"#wang-before-E-P70F6B72FAF8DAF\">[E-P70F6B72FAF8DAF]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福 董事长、执行董事、总裁 男 １９６６年出生 ２００８年６月１１日 至２０１１年６月１０日 王先生于１９８７年毕业于中南工业大学（现为中南大学），主修冶金物理化学，获学士学位；并于１９９０年毕业于中国北京有色金属研究总院，主修冶金物理化学，获硕士学位。王先生历任北京有色金属研究总院副主任、深圳市比格电池有限公司总经理，并于１９９５年２月与吕向阳共同创办比亚迪实业，任总经理；现任本公司董事长、执行董事兼总裁，负责本集团一般营运及制定本集团各项业务策略，并担任比亚迪电子的非执行董事及主席、深圳比亚迪戴姆勒新技术有限公司董事及比亚迪慈善基金会理事。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：教育事件原文日期：１９８７年；教育事件原文日期：１９９０年；创办事件原文日期：１９９５年２月。<\/p>\n<p><strong>来源记录 11　王传福 <a class=\"eid\" data-eid=\"E-PBC7CDDA38C7F8F\" data-side=\"wang-before\" href=\"#wang-before-E-PBC7CDDA38C7F8F\">[E-PBC7CDDA38C7F8F]<\/a><\/strong><\/p>\n<blockquote>\n<p>凭借“技术立身”的好处，王传福带领企业迅速占领市场，并走上降本增效的规模化道路。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 12　王传福 <a class=\"eid\" data-eid=\"E-P3CE44FC910480B\" data-side=\"wang-before\" href=\"#wang-before-E-P3CE44FC910480B\">[E-P3CE44FC910480B]<\/a><\/strong><\/p>\n<blockquote>\n<p>而且，从开始造车起，王传福就执着于“技术立身”，反对一味扩大市场规模，忽视技术创新。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明王传福担任董事长、执行董事、总裁，负责集团一般营运及制定各项业务策略，但未说明其战略制定的具体内容、执行过程或阶段性成果。 <a class=\"eid\" data-eid=\"E-PAD1D43955CDDFA\" data-side=\"wang-before\" href=\"#wang-before-E-PAD1D43955CDDFA\">[E-PAD1D43955CDDFA]<\/a> <a class=\"eid\" data-eid=\"E-P70F6B72FAF8DAF\" data-side=\"wang-before\" href=\"#wang-before-E-P70F6B72FAF8DAF\">[E-P70F6B72FAF8DAF]<\/a><\/li>\n<li>研究判断（待人工复核）：来源披露王传福以自行研发的非专利技术（含电池材料研究、开发、生产技术资料及经营管理技术）作价增资，反映其早期技术投入，但未说明该技术后续迭代路径、应用效果或商业化验证。 <a class=\"eid\" data-eid=\"E-P2199D0816D95CC\" data-side=\"wang-before\" href=\"#wang-before-E-P2199D0816D95CC\">[E-P2199D0816D95CC]<\/a> <a class=\"eid\" data-eid=\"E-PEF1502E6644A56\" data-side=\"wang-before\" href=\"#wang-before-E-PEF1502E6644A56\">[E-PEF1502E6644A56]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称王传福“执着于技术立身”，并称其带领企业“迅速占领市场”“走上降本增效的规模化道路”，但未提供对应时期的具体创新事件、迭代动作、技术指标变化或阶段匹配证据。 <a class=\"eid\" data-eid=\"E-PBC7CDDA38C7F8F\" data-side=\"wang-before\" href=\"#wang-before-E-PBC7CDDA38C7F8F\">[E-PBC7CDDA38C7F8F]<\/a> <a class=\"eid\" data-eid=\"E-P3CE44FC910480B\" data-side=\"wang-before\" href=\"#wang-before-E-P3CE44FC910480B\">[E-P3CE44FC910480B]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>战略设计与行业判断<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-PAD1D43955CDDFA\" data-side=\"wang-before\" href=\"#wang-before-E-PAD1D43955CDDFA\">[E-PAD1D43955CDDFA]<\/a> <a class=\"eid\" data-eid=\"E-P70A4FE260BB020\" data-side=\"wang-before\" href=\"#wang-before-E-P70A4FE260BB020\">[E-P70A4FE260BB020]<\/a> <a class=\"eid\" data-eid=\"E-P70F6B72FAF8DAF\" data-side=\"wang-before\" href=\"#wang-before-E-P70F6B72FAF8DAF\">[E-P70F6B72FAF8DAF]<\/a><\/td>\n<\/tr>\n<tr>\n<td>执行与项目结果<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-P2199D0816D95CC\" data-side=\"wang-before\" href=\"#wang-before-E-P2199D0816D95CC\">[E-P2199D0816D95CC]<\/a> <a class=\"eid\" data-eid=\"E-PFE0170990EEB8C\" data-side=\"wang-before\" href=\"#wang-before-E-PFE0170990EEB8C\">[E-PFE0170990EEB8C]<\/a><\/td>\n<\/tr>\n<tr>\n<td>资本资源与个人职责<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-P37B3320DF334D5\" data-side=\"wang-before\" href=\"#wang-before-E-P37B3320DF334D5\">[E-P37B3320DF334D5]<\/a><\/td>\n<\/tr>\n<tr>\n<td>创新迭代与阶段匹配<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-P2199D0816D95CC\" data-side=\"wang-before\" href=\"#wang-before-E-P2199D0816D95CC\">[E-P2199D0816D95CC]<\/a> <a class=\"eid\" data-eid=\"E-PEF1502E6644A56\" data-side=\"wang-before\" href=\"#wang-before-E-PEF1502E6644A56\">[E-PEF1502E6644A56]<\/a> <a class=\"eid\" data-eid=\"E-P6F067DA25913ED\" data-side=\"wang-before\" href=\"#wang-before-E-P6F067DA25913ED\">[E-P6F067DA25913ED]<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "after": "<h2>4. 经营胜任力、持续创新与迭代能力验证<\/h2>\n<p>本章核对经营与创新事件中的个人职责、对应时期和来源立场。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　王传福 <a class=\"eid\" data-eid=\"E-PAD1D43955CDDFA\" data-side=\"wang-after\" href=\"#wang-after-E-PAD1D43955CDDFA\">[E-PAD1D43955CDDFA]<\/a><\/strong><\/p>\n<blockquote>\n<p>PDF page 30 --- 比亚迪股份有限公司 首次公开发行 A股股票招股意向书 1-1-28 王传福先生目前担任本公司董事长、执行董事、总裁，负责本集团一般营运 及制定本集团各项业务策略。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　王传福 <a class=\"eid\" data-eid=\"E-PBC7CDDA38C7F8F\" data-side=\"wang-after\" href=\"#wang-after-E-PBC7CDDA38C7F8F\">[E-PBC7CDDA38C7F8F]<\/a><\/strong><\/p>\n<blockquote>\n<p>凭借“技术立身”的好处，王传福带领企业迅速占领市场，并走上降本增效的规模化道路。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-PAD6536082A8B11\" data-side=\"wang-after\" href=\"#wang-after-E-PAD6536082A8B11\">[E-PAD6536082A8B11]<\/a><\/strong><\/p>\n<blockquote>\n<p>王传福投入比亚迪实业的无形资产为其自行研发并掌握的非专利技术成果，\n主要包括镍电池等各种电池材料的研究、开发、生产技术资料和一定的经营管理\n技术。该等非专利技术主要应用在镍电池的研究、开发及生产方面，提高了比亚\n迪实业的产品质量，改良了生产工序并优化了工艺流程，促进了比亚迪实业的发\n展。\n3、1999 年-2000年，比亚迪实业股权转让及增加注册资本\n广州融捷及广州天新科贸实业有限公司基于自身业务定位的考虑，并同时考\n虑王传福对比亚迪实业的贡献，为了比亚迪实业的长期稳定发展，分别决定将其\n持有的比亚迪实业的部分及全部股权转让与王传福。1999 年 12 月 28 日，比亚\n迪实业股东会通过决议，同意广州融捷将其持有的比亚迪实业 60.33%股权中的\n10.33%以 485 万元的价格转让给王传福，广州天新科贸实业有限公司将其持有的\n比亚迪实业 4.67%股权以 216.3 万元的价格转让给王传福。2000 年 1 月 3 日，广\n州融捷、广州天新科贸实业有限公司与王传福就上述股权转让事项签订《股权转\n让合同》。本次转让前，截至1998 年 12 月 31 日，比亚迪实业未经审计的净资产\n值为 103,383,847.03 元，每元出资对应的净资产为3.45 元，股权转让价格系经转\n让双方参考公司净资产值协商后确定。\n本次股权转让中，王传福受让股权的资金来源为向吕向阳的个人借款，本次\n股权转让的价款已支付完毕。\n2000 年 1 月 20 日，比亚迪实业股东会通过决议，同意将 1999 年末比亚迪\n实业可供分配利润中的 7,000 万元以 1：1 的比例转增资本，转增完成后，比亚<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：契约/权益事项原文日期：2000年；契约/权益事项原文日期：2000 年 1 月 3 日。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-P79557A6C92EA29\" data-side=\"wang-after\" href=\"#wang-after-E-P79557A6C92EA29\">[E-P79557A6C92EA29]<\/a><\/strong><\/p>\n<blockquote>\n<p>在“燃油车时代”，李书福的吉利汽车发展迅猛；而在“新能源车时代”，则是王传福的比亚迪高歌猛进。这体现出两人对行业的不同认知：1995年，比亚迪刚成立，就将新能源技术作为发展重点，而吉利则到2006年才开始投入研发。2015年，李书福才提出“蓝色吉利行动”计划，目标是用5年时间将新能源汽车的销量占比提高到90%。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：原文日期词：1995年、2006年、2015年（日期归属及适用事项待核实）。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：招股书载其任董事长、执行董事、总裁，负责一般营运及制定各项业务策略；媒体称公司1995年成立即重视新能源技术，2002年起投动力电池、2003年研发混动，王传福称技术领导者常是行业领导者，未载各阶段迭代结果。 <a class=\"eid\" data-eid=\"E-PAD1D43955CDDFA\" data-side=\"wang-after\" href=\"#wang-after-E-PAD1D43955CDDFA\">[E-PAD1D43955CDDFA]<\/a> <a class=\"eid\" data-eid=\"E-P79557A6C92EA29\" data-side=\"wang-after\" href=\"#wang-after-E-P79557A6C92EA29\">[E-P79557A6C92EA29]<\/a> <a class=\"eid\" data-eid=\"E-PAE39B7764C3A0F\" data-side=\"wang-after\" href=\"#wang-after-E-PAE39B7764C3A0F\">[E-PAE39B7764C3A0F]<\/a><\/li>\n<li>研究判断（待人工复核）：媒体称王传福带领企业迅速占领市场并走降本增效规模化道路；另有来源称其早期自建关键设备、将生产线分解为人工工序，形成灵活产线，以40%价差冲击日产电池价格体系，并将公司成功与个人努力相联系，属来源评价。 <a class=\"eid\" data-eid=\"E-PBC7CDDA38C7F8F\" data-side=\"wang-after\" href=\"#wang-after-E-PBC7CDDA38C7F8F\">[E-PBC7CDDA38C7F8F]<\/a> <a class=\"eid\" data-eid=\"E-P959CE95B5DB049\" data-side=\"wang-after\" href=\"#wang-after-E-P959CE95B5DB049\">[E-P959CE95B5DB049]<\/a><\/li>\n<li>研究判断（待人工复核）：招股书载其1999—2000年受让比亚迪实业10.33%和4.67%股权的资金来自向吕向阳个人借款，1997年货币增资39.5万元亦为借款；其另以实际控制人身份承诺承担被追缴税收优惠的税款、滞纳金及罚款。 <a class=\" g><\/p>\n<blockquote>\n<p>2000 年 1 月 25 日，深圳市丽达斯贸易有限公司和王传福签署权益赠与协议，深圳市丽达 斯贸易有限公司将上述转增资本中可获得的 46.67 万股权无偿赠与王传福。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：契约/权益事项原文日期：2000 年 1 月 25 日。<\/p>\n<p><strong>来源记录 2　王传福 <a class=\"eid\" data-eid=\"E-P1AA5DF46635930\" data-side=\"wang-before\" href=\"#wang-before-E-P1AA5DF46635930\">[E-P1AA5DF46635930]<\/a><\/strong><\/p>\n<blockquote>\n<p>本公司控股股东及实际控制人王传福及本公司股东 吕向阳、王传方、王海涛、吴昌会、何志奇、广州融捷、 广州信衡通承诺：自本公司股票上市之日起三十六个月 内， 不转让或者委托他人管理其持有的股份， 也不由本 公司回购其持有的股份。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-PA98F76B1F8CD56\" data-side=\"wang-before\" href=\"#wang-before-E-PA98F76B1F8CD56\">[E-PA98F76B1F8CD56]<\/a><\/strong><\/p>\n<blockquote>\n<p>对此，本公司实际控制人王传福已出具承诺函，承诺： “如果税务机关在任何时 候认定公司及其上述下属公司享受的深圳特区的企业所得税税收优惠不合法， 要 求补缴企业所得税， 本人将全额承担上述应补缴的税款及其滞纳金、 罚款（如有） 等，并放弃对公司及上述下属公司的追索权，保证公司及上述下属公司不会因此 遭受任何损失。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-P2F28FD74D601B6\" data-side=\"wang-before\" href=\"#wang-before-E-P2F28FD74D601B6\">[E-P2F28FD74D601B6]<\/a><\/strong><\/p>\n<blockquote>\n<p>8、发行前股东对其股份自愿锁定的承诺： (1)本公司控股股东及实际控制人王传福及本公司股东吕向阳、王传方、王海涛、吴昌会、何志奇、广州融捷、广州信衡通承诺：自本公司股票上市之日起三十六个月内，不转让或者委托他人管理其持有的股份，也不由本公司回购其持有的股份。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 5　王传福 <a class=\"eid\" data-eid=\"E-P6423B2DBE8D0E3\" data-side=\"wang-before\" href=\"#wang-before-E-P6423B2DBE8D0E3\">[E-P6423B2DBE8D0E3]<\/a><\/strong><\/p>\n<blockquote>\n<p>” 本公司本次发行前股东所持股份的流通限制、股东对所持股份自愿锁定的承诺如下：本公司控股股东及实际控制人王传福及本公司股东吕向阳、王传方、王海涛、吴昌会、何志奇、广州融捷、广州信衡通承诺：自本公司股票上市之日起三十六个月内，不转让或者委托他人管理其持有的股份，也不由本公司回购其持有的股份。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 6　王传福 <a class=\"eid\" data-eid=\"E-P6A5EB0E008169D\" data-side=\"wang-before\" href=\"#wang-before-E-P6A5EB0E008169D\">[E-P6A5EB0E008169D]<\/a><\/strong><\/p>\n<blockquote>\n<p>几年前，王传福来找我，希望鸿海帮他做电池壳，我还带他参观富士康的工厂，结果他看到我们赚钱，就挖走我400多个干部，偷走上万份文件。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。\n使用边界：公开具名观点或单方陈述；不代表指控成立、司法认定或当前信用状况，须核实利益立场、目标回应及处理结果。<\/p>\n<p><strong>来源记录 7　王传福 <a class=\"eid\" data-eid=\"E-PF01691443C1B94\" data-side=\"wang-before\" href=\"#wang-before-E-PF01691443C1B94\">[E-PF01691443C1B94]<\/a><\/strong><\/p>\n<blockquote>\n<p>据路透社报道，上周，被芒格形容为“托马斯·爱迪生和杰克·韦尔奇结合体”的比亚迪董事长兼总裁王传福呼吁“中国同行与比亚迪携手并进，将中国打造成全球汽车强国。”<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。\n使用边界：公开具名观点或单方陈述；不代表指控成立、司法认定或当前信用状况，须核实利益立场、目标回应及处理结果。<\/p>\n<p><strong>来源记录 8　王传福 <a class=\"eid\" data-eid=\"E-PB69EF4F531802F\" data-side=\"wang-before\" href=\"#wang-before-E-PB69EF4F531802F\">[E-PB69EF4F531802F]<\/a><\/strong><\/p>\n<blockquote>\n<p>同样是木工的儿子，俞敏洪认为王传福的“抓机会能力和勇气太强了”。王传福则认为，企业战略不能赌，每一步都要经过大量数据分析、科学验证，而且是以社会需求，以解决问题为导向，底层逻辑是企业家社会责任。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。\n使用边界：公开具名观点或单方陈述；不代表指控成立、司法认定或当前信用状况，须核实利益立场、目标回应及处理结果。<\/p>\n<h3>具名评价与具体事件<\/h3>\n<table>\n<thead>\n<tr>\n<th>资料性质<\/th>\n<th>评价者及原文身份或关系<\/th>\n<th>对应时期<\/th>\n<th>证据与边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>历史争议中的具名单方陈述（未核实）<\/td>\n<td>郭台铭；未披露<\/td>\n<td>未披露；报道发布：2010-09-06（不代替事件时间）<\/td>\n<td><a class=\"eid\" data-eid=\"E-P6A5EB0E008169D\" data-side=\"wang-before\" href=\"#wang-before-E-P6A5EB0E008169D\">[E-P6A5EB0E008169D]<\/a> 来源陈述，未完成授权访谈；身份职务不代表利益关系已核实，评价或指控不等于事实成立，不据此评级<\/td>\n<\/tr>\n<tr>\n<td>公开具名评价<\/td>\n<td>芒格；未披露<\/td>\n<td>未披露；报道发布：未披露（不代替事件时间）<\/td>\n<td><a class=\"eid\" data-eid=\"E-PF01691443C1B94\" data-side=\"wang-before\" href=\"#wang-before-E-PF01691443C1B94\">[E-PF01691443C1B94]<\/a> 来源陈述，未完成授权访谈；身份职务不代表利益关系已核实，评价或指控不等于事实成立，不据此评级<\/td>\n<\/tr>\n<tr>\n<td>公开具名评价<\/td>\n<td>俞敏洪；未披露<\/td>\n<td>未披露；报道发布：未披露（不代替事件时间）<\/td>\n<td><a class=\"eid\" data-eid=\"E-PB69EF4F531802F\" data-side=\"wang-before\" href=\"#wang-before-E-PB69EF4F531802F\">[E-PB69EF4F531802F]<\/a> 来源陈述，未完成授权访谈；身份职务不代表利益关系已核实，评价或指控不等于事实成立，不据此评级<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：2000年1月25日王传福与深圳市丽达斯贸易有限公司签署权益赠与协议，获赠46.67万股股权，来源载明为合同行为，未披 7C5FA7BA8B3F\">[E-P567C5FA7BA8B3F]<\/a><\/strong><\/p>\n<blockquote>\n<p>在新《企业所得税法》实施前，根据《深圳市人民政府关于宝安、龙岗两个市辖区有关税收政策问题的通知》（深府［１９９３］ １号）规定，设在宝安、龙岗两区的所有企事业单位，按照深圳经济特区的规定，一律按１５％的税率征收企业所得税，免征地方所得税和地方费附加；宝安、龙岗两区的各项税收优惠政策，除对地产地销产品减免税的规定不能执行外，其余均按照深圳经济特区的有关优惠政策执行。本公司、深圳比亚迪锂电池、比亚迪精密制造、深圳比亚迪汽车、深圳比亚迪电子部品件、比亚迪汽车销售、深圳比亚迪电池模具、深圳比亚迪电子、深圳比亚迪技工学校注册地均位于龙岗区，不属于深圳经济特区的区域范围内。上述公司于报告期内享受的深圳特区企业所得税优惠符合深圳市人民政府的有关规定，但与《广东省经济特区条例》的规定具有不一致之处，存在被税务机关认定为不符合国家法律和行政法规的规定享受税收优惠，从而被追缴税款的风险。报告期内，本公司及下属子公司享受的上述税收优惠分别增加本公司合并报表口径净利润９９，３３９千元、１２４，５８８千元及３３，８５３千元，分别占当期合并报表口径净利润的３．４０％、３．０５％及２．６５％，上述税收优惠均已计入当期非经常性损益。对此，本公司实际控制人王传福已出具承诺函，承诺：“如果税务机关在任何时候认定公司及其上述下属公司享受的深圳特区的企业所得税税收优惠不合法，要求补缴企业所得税，本人将全额承担上述应补缴的税款及其滞纳金、罚款（如有）等，并放弃对公司及上述下属公司的追索权，保证公司及上述下属公司不会因此遭受任何损失。”<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　王传福 <a class=\"eid\" data-eid=\"E-P2F28FD74D601B6\" data-side=\"wang-after\" href=\"#wang-after-E-P2F28FD74D601B6\">[E-P2F28FD74D601B6]<\/a><\/strong><\/p>\n<blockquote>\n<p>8、发行前股东对其股份自愿锁定的承诺： (1)本公司控股股东及实际控制人王传福及本公司股东吕向阳、王传方、王海涛、吴昌会、何志奇、广州融捷、广州信衡通承诺：自本公司股票上市之日起三十六个月内，不转让或者委托他人管理其持有的股份，也不由本公司回购其持有的股份。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　王传福 <a class=\"eid\" data-eid=\"E-P6423B2DBE8D0E3\" data-side=\"wang-after\" href=\"#wang-after-E-P6423B2DBE8D0E3\">[E-P6423B2DBE8D0E3]<\/a><\/strong><\/p>\n<blockquote>\n<p>” 本公司本次发行前股东所持股份的流通限制、股东对所持股份自愿锁定的承诺如下：本公司控股股东及实际控制人王传福及本公司股东吕向阳、王传方、王海涛、吴昌会、何志奇、广州融捷、广州信衡通承诺：自本公司股票上市之日起三十六个月内，不转让或者委托他人管理其持有的股份，也不由本公司回购其持有的股份。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 4　王传福 <a class=\"eid\" data-eid=\"E-P37B3320DF334D5\" data-side=\"wang-after\" href=\"#wang-after-E-P37B3320DF334D5\">[E-P37B3320DF334D5]<\/a><\/strong><\/p>\n<blockquote>\n<p>2000 年 1 月 25 日，深圳市丽达斯贸易有限公司和王传福签署权益赠与协议，深圳市丽达 斯贸易有限公司将上述转增资本中可获得的 46.67 万股权无偿赠与王传福。<\/p>\n<\/blockquote>\n<p>来源归属：王传福；原文事件时间：契约/权益事项原文日期：2000 年 1 月 25 日。<\/p>\n<h3>具名评价与具体事件<\/h3>\n<table>\n<thead>\n<tr>\n<th>资料性质<\/th>\n<th>评价者及原文身份或关系<\/th>\n<th>对应时期<\/th>\n 已有的来源陈述、研究判断与主要限制。<\/p>\n<p>正文来源回查：<a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-P3B9E7CA7487BD9\" data-side=\"zhang-before\" href=\"#zhang-before-E-P3B9E7CA7487BD9\">[E-P3B9E7CA7487BD9]<\/a> <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-P06DE04281E0C04\" data-side=\"zhang-before\" href=\"#zhang-before-E-P06DE04281E0C04\">[E-P06DE04281E0C04]<\/a> <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-before\" href=\"#zhang-before-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-P796DB84FA6879C\" data-side=\"zhang-before\" href=\"#zhang-before-E-P796DB84FA6879C\">[E-P796DB84FA6879C]<\/a> <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a> <a class=\"eid\" data-eid=\"E-PB23B2122A86F35\" data-side=\"zhang-before\" href=\"#zhang-before-E-PB23B2122A86F35\">[E-PB23B2122A86F35]<\/a><\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明张勇1988年技校毕业，同年进入四川拖拉机厂任电焊工；两处记载一致，但未说明技校名称、专业及拖拉机厂具体职务层级。 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a> <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称张勇回归一线可“校准战略、缩短试错周期”“带领走出转型迷雾”，属预期性表述，未提供已发生的可验证经营结果或迭代成效。 <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-PC3DE4558777540\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC3DE4558777540\">[E-PC3DE4558777540]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明张勇在2011年前后实施分级授权机制，店长、小区经理等有明确签字权额度，黄铁鹰评价其放权力度在民企中少见。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明张勇当前持股33.64亿股、占比37.35%，但未披露基准日，无法确认是否为最新时点数据。 <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-before\" href=\"#zhang-before-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a><\/li>\n<li>研究判断（待人工复核）：来源披露张勇于2020年4月宣布10–15年退休计划及接班人积分制，同时称原核心成员‘性价比不高’，反映其对治理代际过渡的主动设计，但未说明制度落地进展。 <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a> <a class=\"eid\" data-eid=\"E-P6D0C2105D46F24\" data-side=\"zhang-before\" href=\"#zhang-before-E-P6D0C2105D46F24\">[E-P6D0C2105D46F24]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>报告概述<\/td>\n<td>报告范围与来源时期见本章事实表，输入身份线索不等于已核实事实。<\/td>\n<\/tr>\n<tr>\n<td>核心发现点<\/td>\n<td>已汇总正文实际使用的来源陈述，未补入正文之外的新事实。<\/td>\n<\/tr>\n<tr>\n<td>需关注信号<\/td>\n<td>已发现信号与专业查询范围见第9、12章；空结果不证明无风险。<\/td>\n<\/tr>\n<tr>\n<td>公司所属赛道竞争格局<\/td>\n<td>可比候选与指标限制见第8章，尚不形成能力或信用排名。<\/td>\n<\/tr>\n<tr>\n<td>总体评估<\/td>\n<td>正文仍有47项待核验或缺证说明，本摘要不作正式交付结论。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "after": "<h2>1. 摘要<\/h2>\n<p>本摘要汇总正文已有的来源陈述、研究判断与主要限制。<\/p>\n<p>正文来源回查：<a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a> <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-P51D7FCEEEC09E2\" data-side=\"zhang-after\" href=\"#zhang-after-E-P51D7FCEEEC09E2\">[E-P51D7FCEEEC09E2]<\/a> <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-PD27CA928B6F795\" data-side=\"zhang-after\" href=\"#zhang-after-E-PD27CA928B6F795\">[E-PD27CA928B6F795]<\/a> <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a><\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源称张勇持33.64亿股、占37.35%，但未载基准日；另讯载20.82亿股、约37.36%，研报载其个人拥有44.01%权益。2007年受让施永宏夫妇18%股权后，张勇夫妇持68%，仅称按原始出资额。 <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-P083F09DDECAA63\" data-side=\"zhang-after\" href=\"#zhang-after-E-P083F09DDECAA63\">[E-P083F09DDECAA63]<\/a> <a class=\"eid\" data-eid=\"E-PABB44EDE9176D9\" data-side=\"zhang-after\" href=\"#zhang-after-E-PABB44EDE9176D9\">[E-PABB44EDE9176D9]<\/a> <a class=\"eid\" data-eid=\"E-P78265637F5E87B\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78265637F5E87B\">[E-P78265637F5E87B]<\/a> <a class=\"eid\" data-eid=\"E-P249FD1EF4660A7\" data-side=\"zhang-after\" href=\"#zhang-after-E-P249FD1EF4660A7\">[E-P249FD1EF4660A7]<\/a><\/li>\n<li>研究判断（待人工复核）：2011年出版物载签字权分层：100万元以上须经张勇，100万元以下由副总、财务总监、大区经理负责，店长有3万元签字权，后续是否沿用未载明；研究报告载其任执行董事统筹管理及战略；其自称少插手店铺管理、海外由独立团队管理，并承认无法检查门店。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a> <a class=\"eid\" data-eid=\"E-PED2349EB855EF4\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED2349EB855EF4\">[E-PED2349EB855EF4]<\/a> <a class=\"eid\" data-eid=\"E-P99F43CB3B9840E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P99F43CB3B9840E\">[E-P99F43CB3B9840E]<\/a> <a class=\"eid\" data-eid=\"E-P52F1C780680F25\" data-side=\"zhang-after\" href=\"#zhang-after-E-P52F1C780680F25\">[E-P52F1C780680F25]<\/a><\/li>\n<li>研究判断（待人工复核）：公开资料称张勇生于1971年；1988年技校毕业后进入四川拖拉机厂，另有来源称回简阳任电焊工，首份工作表述不同；1994年3月张勇夫妇与施永宏、李海燕夫妇创办海底捞。 <a class=\"eid\" data-eid=\"E-P7DD3858C9DAFFE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P7DD3858C9DAFFE\">[E-P7DD3858C9DAFFE]<\/a> <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-after\" href=\"#zhang-after-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a> <a class=\"eid\" data-eid=\"E-PC518FB14D6C40E\" data-side=\"zhang-after\" href=\"#zhang-after-E-PC518FB14D6C40E\">[E-PC518FB14D6C40E]<\/a> <a class=\"eid\" data-eid=\"E-P84060BD57E289E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P84060BD57E289E\">[E-P84060BD57E289E]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>报告概述<\/td>\n<td>报告范围与来源时期见本章事实表，输入身份线索不等于已核实事实。<\/td>\n<\/tr>\n<tr>\n<td>核心发现点<\/td>\n<td>已汇总正文实际使用的来源陈述，未补入正文之外的新事实。<\/td>\n<\/tr>\n<tr>\n<td>需关注信号<\/td>\n<td>已发现信号与专业查询范围见第9、12章；空结果不证明无风险。<\/td>\n<\/tr>\n<tr>\n<td>公司所属赛道竞争格局<\/td>\n<td>可比候选与指标限制见第8章，尚不形成能力或信用排名。<\/td>\n<\/tr>\n<tr>\n<td>总体评估<\/td>\n<td>正文仍有47项待核验或缺证说明，本摘要不作正式交付结论。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "before_chars": 1047, "after_chars": 1137, "note": "摘要继承正文已有判断，未把程序修复状态当作人物事实或已完成独立核验。"}, {"n": 2, "title": "创始人底色画像", "before": "<h2>2. 创始人底色画像<\/h2>\n<h3>核心关系网络图<\/h3>\n<p><img alt=\"核心关系网络图\" src=\"projects/1/visual_evidence/relationship_graph_20261020165609.svg\"/><\/p>\n<blockquote>\n<p>注：本图根据已取得的结构化证据生成；虚线或待核验节点不代表已确认事实。<\/p>\n<\/blockquote>\n<p>本章列示公开资料中的教育与职业经历，区分事件日期和文件日期。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a><\/strong><\/p>\n<blockquote>\n<p>生平 [ 编辑 ] 张勇出生在四川一个普通的工人之家，1988年技校毕业之后回简阳任电焊工 [ 4 ] 。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：教育事件原文日期：1988年。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a><\/strong><\/p>\n<blockquote>\n<p>围绕管理模式调整问题，张勇表示，创办海底捞至今，始终相信“双手改变命运”的价值观。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-P7DD3858C9DAFFE\" data-side=\"zhang-before\" href=\"#zhang-before-E-P7DD3858C9DAFFE\">[E-P7DD3858C9DAFFE]<\/a><\/strong><\/p>\n<blockquote>\n<p>公开资料显示，张勇出生于1971年，是海底捞的创办人之一，在海底捞积累了逾30年食品行业及管理经验。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：创办事件原文日期：1971年。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a><\/strong><\/p>\n<blockquote>\n<p>（编辑：张云阶 供稿：现代管理与技术创新哲学社会科学创新基地） 张勇董事长简介 1988年技校毕业后，张勇进入四川拖拉机厂。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：教育事件原文日期：1988年。<\/p>\n<p><strong>来源记录 5　张勇 <a class=\"eid\" data-eid=\"E-P84060BD57E289E\" data-side=\"zhang-before\" href=\"#zhang-before-E-P84060BD57E289E\">[E-P84060BD57E289E]<\/a><\/strong><\/p>\n<blockquote>\n<p>1994年3月，张勇夫妇和同学施永宏李海燕夫妇四人创办以经营川味火锅为主的餐饮企业 海底捞 ，起初张勇不会炒料，当时的他左手拿书、右手炒料。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：创办事件原文日期：1994年3月。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明张勇1988年技校毕业，同年进入四川拖拉机厂任电焊工；两处记载一致，但未说明技校名称、专业及拖拉机厂具体职务层级。 <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a><\/li>\n<li>研究判断（待 \n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：张勇在2018年采访中以‘善良’评价其子，来源载明其对人格特质的重视倾向，但属私人语境下的价值取向表达，不构成对本人行为或风险的直接佐证。 <a class=\"eid\" data-eid=\"E-P3B9E7CA7487BD9\" data-side=\"zhang-before\" href=\"#zhang-before-E-P3B9E7CA7487BD9\">[E-P3B9E7CA7487BD9]<\/a><\/li>\n<\/ul>\n<p>来源中的评价仅代表评价者观点；现有资料不足以据此确定人格、诚信或个人信用等级。<\/p>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>责任心与事业心<\/td>\n<td>当前入选材料尚不能回答该问题，需核查留存原文或有针对性补证。<\/td>\n<\/tr>\n<tr>\n<td>诚信与利益取舍<\/td>\n<td>当前入选材料尚不能回答该问题，需核查留存原文或有针对性补证。<\/td>\n<\/tr>\n<tr>\n<td>表达与风险偏好<\/td>\n<td>已取得本人行为或公开表达线索；尚不足以据此判定人格、诚信或风险偏好。 <a class=\"eid\" data-eid=\"E-P3B9E7CA7487BD9\" data-side=\"zhang-before\" href=\"#zhang-before-E-P3B9E7CA7487BD9\">[E-P3B9E7CA7487BD9]<\/a> <a class=\"eid\" data-eid=\"E-PC828DA9E80E05C\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC828DA9E80E05C\">[E-PC828DA9E80E05C]<\/a> <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a><\/td>\n<\/tr>\n<tr>\n<td>压力下行为与评价者立场<\/td>\n<td>已取得本人行为或公开表达线索；尚不足以据此判定人格、诚信或风险偏好。 <a class=\"eid\" data-eid=\"E-PC828DA9E80E05C\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC828DA9E80E05C\">[E-PC828DA9E80E05C]<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "after": "<h2>3. 人格特质风险<\/h2>\n<p>本章记录公开表达和具体行为线索；单次发言及外部评价不足以确定人格或诚信。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-PFE6DBE68863C76\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFE6DBE68863C76\">[E-PFE6DBE68863C76]<\/a><\/strong><\/p>\n<blockquote>\n<p>围绕管理模式调整问题，张勇表示，创办海底捞至今，始终相信“双手改变命运”的价值观。而在考核维度层面，他直率地指出：“目前的困难和大盘没什么关系，大环境好坏，餐饮都不会太差，因为吃饭是刚需，不会因为经济环境不好就少吃两顿。在管理上出现问题，是我们内部原因导致，是我们坚持得不够好。我现在就是要跑步，争取多干点，给大家做个贡献。”张勇笑称。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-PED2F68F6C13C80\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED2F68F6C13C80\">[E-PED2F68F6C13C80]<\/a><\/strong><\/p>\n<blockquote>\n<p>谈及餐饮的个性化与标准化问题，张勇表示，首先，海底捞内部“双手改变命运”的核心价值观不会改变。而在产品标准化层面，张勇直言不讳。“以前我们是犯了一个错误，过去因为生意特别好，我脑海里面总是受国外快餐连锁品牌的影响。对于连锁餐饮企业的标准化，虽然没有去很好地总结它，但是行为上会去迎合它。”<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-PB9C32F0BF63C9B\" data-side=\"zhang-after\" href=\"#zhang-after-E-PB9C32F0BF63C9B\">[E-PB9C32F0BF63C9B]<\/a><\/strong><\/p>\n<blockquote>\n<p>3月10日晚，海底捞餐饮有限责任公司董事长张勇先生来到清华经管学院，做客“中国企业管理最佳实践讲坛”，并以“海底捞的经营智慧”为题发表演讲，与来自校内外的300多名听众分享了海底捞火锅创业、发展的实践经验。学院的钱小军教授和郑晓明教授也以对话的形式，从企业文化、领导力、人力资源等方面与张勇先生深入探讨了海底捞的经营管理智慧。学院党委书记、领导力研究中心主任杨斌教授主持了这一活动。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：原文日期词：3月10日（日期归属及适用事项待核实）。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-P1E257A005A4027\" data-side=\"zhang-after\" href=\"#zhang-after-E-P1E257A005A4027\">[E-P1E257A005A4027]<\/a><\/strong><\/p>\n<blockquote>\n<p>2022年末，防疫政策转变后，海底捞曾短暂面临员工紧缺的压力，但张勇表示，目前海底捞人员是充足的。“或许你还是能在一些店里看得到笨脚笨手的或者比较夸张地在努力想做好的员工。但就目前情况来看，我觉得10月份左右，海底捞的管理可以恢复到疫情前水平。”<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：原文日期词：2022年（日期归属及适用事项待核实）。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明张勇把管理困难归因于内部，称“是我们坚持得不够好”，并直言过去在标准化上“犯了一个错误”。这些分析属于其本人自述式的责任归因和检讨，不是外部独立核验。 <a class=\"eid\" data-eid=\"E-PFE6DBE68863C76\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFE6DBE68863C76\">[E-PFE6DBE68863C76]<\/a> <a class=\"eid\" data-eid=\"E-PED2F68F6C13C80\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED2F68F6C13C80\">[E-PED2F68F6C13C80]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称张勇自述创办至今始终相信“双手改变命运”的价值观，并称该核心价值观不会改变；另一来源记载其在3月10日（年份未明）到清华经管讲坛以“海底捞的经营智慧”发表演讲，并与教授就企业文化、领导力对话。 <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a> <a class=\"eid\" data-eid=\"E-PCBD83B0133B591\" data-side=\"zhang-after\" href=\"#zhang-after-E-PCBD83B0133B591\">[E-PCBD83B0133B591]<\/a> <a class=\"eid\" data-eid=\"E-PB9C32F0BF63C9B\" data-side=\"zhang-after\" href=\"#zhang-after-E-PB9C32F0BF63C9B\">[E-PB9C32F0BF63C9B]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明，2022年末防疫政策转变后，海底捞曾短暂面临员工紧缺压力；张勇表示目前人员充足，并称“就目前情况来看”觉得10月份左右管理可恢复到疫情前水平。上述均为来源陈述，未经独立核验，时点为2022年末及引述中的“目前”。 <a class=\"eid\" data-eid=\"E-PC828DA9E80E05C\" data-side=\"zhang-after\" href=\"#zhang-after-E-PC828DA9E80E05C\">[E-PC828DA9E80E05C]<\/a> <a class=\"eid\" data-eid=\"E-P1E257A005A4027\" data-side=\"zhang-after\" href=\"#zhang-after-E-P1E257A005A4027\">[E-P1E257A005A4027]<\/a><\/li>\n<\/ul>\n<p>来源中的评价仅代表评价者观点；现有资料不足以据此确定人格、诚信或个人信用等级。<\/p>\n<h3>本章研究覆盖与核验问题<\/h3>\n<p>共同核验边界：已取得本人行为或公开表达线索；尚不足以据此判定人格、诚信或风险偏好。<\/p>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>责任心与事业心<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P92929998A16D84\" data-side=\"zhang-after\" href=\"#zhang-after-E-P92929998A16D84\">[E-P92929998A16D84]<\/a> <a class=\"eid\" data-eid=\"E-P77D4492456DBB0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P77D4492456DBB0\">[E-P77D4492456DBB0]<\/a> <a class=\"eid\" data-eid=\"E-PB9C32F0BF63C9B\" data-side=\"zhang-after\" href=\"#zhang-after-E-PB9C32F0BF63C9B\">[E-PB9C32F0BF63C9B]<\/a><\/td>\n<\/tr>\n<tr>\n<td>诚信与利益取舍<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P196C50B1B74D6E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P196C50B1B74D6E\">[E-P196C50B1B74D6E]<\/a><\/td>\n<\/tr>\n<tr>\n<td>表达与风险偏好<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a> <a class=\"eid\" data-eid=\"E-PC828DA9E80E05C\" data-side=\"zhang-after\" href=\"#zhang-after-E-PC828DA9E80E05C\">[E-PC828DA9E80E05C]<\/a> <a class=\"eid\" data-eid=\"E-PCBD83B0133B591\" data-side=\"zhang-after\" href=\"#zhang-after-E-PCBD83B0133B591\">[E-PCBD83B0133B591]<\/a><\/td>\n<\/tr>\n<tr>\n<td>压力下行为与评价者立场<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-PC828DA9E80E05C\" data-side=\"zhang-after\" href=\"#zhang-after-E-PC828DA9E80E05C\">[E-PC828DA9E80E05C]<\/a> <a class=\"eid\" data-eid=\"E-P77D4492456DBB0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P77D4492456DBB0\">[E-P77D4492456DBB0]<\/a> <a class=\"eid\" data-eid=\"E-P1E257A005A4027\" data-side=\"zhang-after\" href=\"#zhang-after-E-P1E257A005A4027\">[E-P1E257A005A4027]<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "before_chars": 1031, "after_chars": 1984, "note": "内部管理反思和价值观表述保留为本人自述或媒体转述；疫情后经营预期未写成已经实现，未作人格或风险偏好评分。"}, {"n": 4, "title": "经营胜任力、持续创新与迭代能力验证", "before": "<h2>4. 经营胜任力、持续创新与迭代能力验证<\/h2>\n<p>本章核对经营与创新事件中的个人职责、对应时期和来源立场。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇此番回归，也承载了带领海底捞走出转型迷雾的期望。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a><\/strong><\/p>\n<blockquote>\n<p>2022年3月1日，海底捞发布管理层人事任命公告，董事会主席兼前首席执行官张勇将继续担任董事会主席及执行董事。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-PE54788B479297E\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE54788B479297E\">[E-PE54788B479297E]<\/a><\/strong><\/p>\n<blockquote>\n<p>现如今，张勇的“资本帝国”已经形成完整的上下游产业链，海底捞建立了一系列产业链关联公司，帝国雏形基本形成。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a><\/strong><\/p>\n<blockquote>\n<p>（编辑：张云阶 供稿：现代管理与技术创新哲学社会科学创新基地） 张勇董事长简介 1988年技校毕业后，张勇进入四川拖拉机厂。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：教育事件原文日期：1988年。<\/p>\n<p><strong>来源记录 5　张勇 <a class=\"eid\" data-eid=\"E-PED2349EB855EF4\" data-side=\"zhang-before\" href=\"#zhang-before-E-PED2349EB855EF4\">[E-PED2349EB855EF4]<\/a><\/strong><\/p>\n<blockquote>\n<p>全球发行完成后，张勇和施永宏仍担任执行 董事，负责统筹公司管理及战略发展。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 6　张勇 <a class=\"eid\" data-eid=\"E-P420E6D73B79793\" data-side=\"zhang-before\" href=\"#zhang-before-E-P420E6D73B79793\">[E-P420E6D73B79793]<\/a><\/strong><\/p>\n<blockquote>\n<p>随后，张勇董事长还与清华经管学院部分教授就海底捞的实践和战略选择等问题进行了更加广泛而深入的探讨。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 7　张勇 <a class=\"eid\" data-eid=\"E-PC3DE4558777540\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC3DE4558777540\">[E-PC3DE4558777540]<\/a><\/strong><\/p>\n<blockquote>\n<p>一方面，过去两年海底捞看似在稳打稳扎地推进新战略，但在这个过程中难免会有疏漏或者偏向，而张勇回归一线，则能够以最直接的方式校准战略，缩短试错周期。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 8　张勇 <a class=\"eid\" data-eid=\"E-P515822CAC4BF5E\" data-side=\"zhang-before\" href=\"#zhang-before-E-P515822CAC4BF5E\">[E-P515822CAC4BF5E]<\/a><\/strong><\/p>\n<blockquote>\n<p>图片来源：每经资料图 在周年股东大会上，面对海底捞在内地面临的开店天花板问题，张勇回应称，餐饮业竞争一直非常激烈，技术的进步带来了规模化的拓展，但是规模化扩展也带来了很多无法解决的问题。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 9　张勇 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-before\" href=\"#zhang-before-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇是推动海底捞“立法”的人，很多制度创新和组织变革皆出自于他，包括2021年海底捞推行的“啄木鸟”计划。但他对具体的店铺管理却很少插手，在十年甚至更早之前就做了“甩手掌柜”，他自我归因于“太懒”——从小就这样。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 10　张勇 <a class=\"eid\" data-eid=\"E-PCAD501E9E768E8\" data-side=\"zhang-before\" href=\"#zhang-before-E-PCAD501E9E768E8\">[E-PCAD501E9E768E8]<\/a><\/strong><\/p>\n<blockquote>\n<p>海底捞创始人张勇重任CEO“二次革命” 战略推进红石榴计划 海底捞：未来几年中式餐饮出海会重新洗牌｜出海·消费 【财新网】 近日，一名 海底捞 前员工在社交媒体平台发布长文，反映自己在海底捞工作期间遭遇的不公平待遇。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 11　张勇 <a class=\"eid\" data-eid=\"E-P62A07A9DF70064\" data-side=\"zhang-before\" href=\"#zhang-before-E-P62A07A9DF70064\">[E-P62A07A9DF70064]<\/a><\/strong><\/p>\n<blockquote>\n<p>创始人张勇重掌CEO 1月13日，海底捞发布公告称，因服务于公司战略发展的董事会组成及角色调整，即日起，苟轶群辞任公司执行董事及首席执行官（即CEO），同时，基于对本公司管理层安排的整体调整及综合考量，董事会主席兼执行董事张勇已经获委任为海底捞CEO。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源称张勇回归一线可“校准战略、缩短试错周期”“带领走出转型迷雾”，属预期性表述，未提供已发生的可验证经营结果或迭代成效。 <a class=\"eid\" data-eid=\"E-PC3DE4558777540\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC3DE4558777540\">[E-PC3DE4558777540]<\/a> <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a><\/li>\n<li>研究判断（待人工复核）：仅载明张勇于1988年技校毕业并入职四川拖拉机厂，该教育与早期职业经历无法直接验证其当前经营胜任力或创新迭代能力。 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a><\/li>\n<li>研究判断（待人工复核）：该公告仅说明张勇获委任为CEO系基于董事会整体调整及综合考量，未披露其具体战略职责、执行动作、资本操作、资源调配或创新迭代行为。 <a class=\"eid\" data-eid=\"E-P62A07A9DF70064\" data-side=\"zhang-before\" href=\"#zhang-before-E-P62A07A9DF70064\">[E-P62A07A9DF70064]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>战略设计与行业判断<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-PED2349EB855EF4\" data-side=\"zhang-before\" href=\"#zhang-before-E-PED2349EB855EF4\">[E-PED2349EB855EF4]<\/a> <a class=\"eid\" data-eid=\"E-P420E6D73B79793\" data-side=\"zhang-before\" href=\"#zhang-before-E-P420E6D73B79793\">[E-P420E6D73B79793]<\/a><\/td>\n<\/tr>\n<tr>\n<td>执行与项目结果<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a> <a class=\"eid\" data-eid=\"E-PCAD501E9E768E8\" data-side=\"zhang-before\" href=\"#zhang-before-E-PCAD501E9E768E8\">[E-PCAD501E9E768E8]<\/a> <a class=\"eid\" data-eid=\"E-P62A07A9DF70064\" data-side=\"zhang-before\" href=\"#zhang-before-E-P62A07A9DF70064\">[E-P62A07A9DF70064]<\/a><\/td>\n<\/tr>\n<tr>\n<td>资本资源与个人职责<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-PE54788B479297E\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE54788B479297E\">[E-PE54788B479297E]<\/a><\/td>\n<\/tr>\n<tr>\n<td>创新迭代与阶段匹配<\/td>\n<td>已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a> <a class=\"eid\" data-eid=\"E-P515822CAC4BF5E\" data-side=\"zhang-before\" href=\"#zhang-before-E-P515822CAC4BF5E\">[E-P515822CAC4BF5E]<\/a> <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-before\" href=\"#zhang-before-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "after": "<h2>4. 经营胜任力、持续创新与迭代能力验证<\/h2>\n<p>本章核对经营与创新事件中的个人职责、对应时期和来源立场。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇是推动海底捞“立法”的人，很多制度创新和组织变革皆出自于他，包括2021年海底捞推行的“啄木鸟”计划。但他对具体的店铺管理却很少插手，在十年甚至更早之前就做了“甩手掌柜”，他自我归因于“太懒”——从小就这样。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：组织/管理事项原文日期：2021年。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-PABB44EDE9176D9\" data-side=\"zhang-after\" href=\"#zhang-after-E-PABB44EDE9176D9\">[E-PABB44EDE9176D9]<\/a><\/strong><\/p>\n<blockquote>\n<p>1.3、股权结构：创始人控股，经营稳健\n公司股权结构清晰。海底捞控股股东为创始人张勇，张勇个人拥有公司发行股份\n44.01%的权益。张勇夫妇通过 ZY NP Ltd. 及 SP NP Ltd. 直接持股 34.61%。施永\n宏夫妇通过 SYH NP Ltd. 及 LHY NP Ltd. 直接持股 16.40%。NP United Holding\nLtd.（张勇夫妇持有该公司 67.85%权益）持股 34.00%。经历二十余年的运营，创\n始人积累了丰富的市场及管理经验。全球发行完成后，张勇和施永宏仍担任执行\n董事，负责统筹公司管理及战略发展。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。\n权益归属：本段涉及多个持有主体，各比例对应主体及持股层级分别见原句，不能整体归为夫妇或个人持股。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a><\/strong><\/p>\n<blockquote>\n<p>2022年3月1日，海底捞发布管理层人事任命公告，董事会主席兼前首席执行官张勇将继续担任董事会主席及执行董事。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：原文日期词：2022年3月1日（日期归属及适用事项待核实）。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-PE54788B479297E\" data-side=\"zhang-after\" href=\"#zhang-after-E-PE54788B479297E\">[E-PE54788B479297E]<\/a><\/strong><\/p>\n<blockquote>\n<p>现如今，张勇的“资本帝国”已经形成完整的上下游产业链，海底捞建立了一系列产业链关联公司，帝国雏形基本形成。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源称张勇推动海底捞“立法”，多项制度创新和组织变革出自其手，包括2021年“啄木鸟”计划；同时称其很少插手具体店铺管理。 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/li>\n<li>研究判断（待人工复核）：研究报告载张勇为控股股东、个人拥有发行股份44.01%权益；全球发行完成后其与施永宏仍任执行董事，统筹管理及战略发展。 <a class=\"eid\" data-eid=\"E-PABB44EDE9176D9\" data-side=\"zhang-after\" href=\"#zhang-after-E-PABB44EDE9176D9\">[E-PABB44EDE9176D9]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<p>共同核验边界：已取得职责、事件或结果线索；个人贡献、对应时期及因果关系仍待核实。<\/p>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>战略设计与行业判断<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-PED2349EB855EF4\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED2349EB855EF4\">[E-PED2349EB855EF4]<\/a> <a class=\"eid\" data-eid=\"E-P420E6D73B79793\" data-side=\"zhang-after\" href=\"#zhang-after-E-P420E6D73B79793\">[E-P420E6D73B79793]<\/a><\/td>\n<\/tr>\n<tr>\n<td>执行与项目结果<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a> <a class=\"eid\" data-eid=\"E-PCAD501E9E768E8\" data-side=\"zhang-after\" href=\"#zhang-after-E-PCAD501E9E768E8\">[E-PCAD501E9E768E8]<\/a> <a class=\"eid\" data-eid=\"E-P62A07A9DF70064\" data-side=\"zhang-after\" href=\"#zhang-after-E-P62A07A9DF70064\">[E-P62A07A9DF70064]<\/a><\/td>\n<\/tr>\n<tr>\n<td>资本资源与个人职责<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-PE54788B479297E\" data-side=\"zhang-after\" href=\"#zhang-after-E-PE54788B479297E\">[E-PE54788B479297E]<\/a> <a class=\"eid\" data-eid=\"E-P606E1004641F65\" data-side=\"zhang-after\" href=\"#zhang-after-E-P606E1004641F65\">[E-P606E1004641F65]<\/a><\/td>\n<\/tr>\n<tr>\n<td>创新迭代与阶段匹配<\/td>\n<td>已有材料，待核验（边界见上） <a class=\"eid\" data-eid=\"E-P515822CAC4BF5E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P515822CAC4BF5E\">[E-P515822CAC4BF5E]<\/a> <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a> <a class=\"eid\" data-eid=\"E-P12E3EE76C4A938\" data-side=\"zhang-after\" href=\"#zhang-after-E-P12E3EE76C4A938\">[E-P12E3EE76C4A938]<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "before_chars": 2365, "after_chars": 1603, "note": "个人、夫妇及持股实体的权益分别理解；网站自我介绍中的资本市场、供稿单位中的技术创新不计作个人资本或创新证据，原文与研究记录保留。"}, {"n": 5, "title": "识人用人、统筹管理及核心经营管控能力", "before": "<h2>5. 识人用人、统筹管理及核心经营管控能力<\/h2>\n<p>本章列示用人、授权及经营管控资料，保留生效条件和历史范围。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇一直敢于向下放权，黄铁鹰曾评价“这种放心大胆的授权在民营企业实属少见”。他在《海底捞你学不会》中记录：100万元以上的签字需要经过张勇，100万元以下是由副总、财务总监和大区经理负责的；大宗采购部长、工程部长和小区经理有30万元的签字权；店长有3万元的签字权。书是在2011年出版的，在那之后，张勇心心念念的一件事，就是进一步给店长“松绑”，让他们成为海底捞最精悍的作战单元。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-PA922054DC5E4DD\" data-side=\"zhang-before\" href=\"#zhang-before-E-PA922054DC5E4DD\">[E-PA922054DC5E4DD]<\/a><\/strong><\/p>\n<blockquote>\n<p>那是2015年海底捞的年会，100多名店长和管理层从全国各地来到三亚，本该是集体庆祝的时候，张勇却给大家当头一棒—— 宣布要全面裁撤小区经理，以减少海底捞的管理层级。他为此酝酿已久——4年前已“砍掉了”大区经理，“差点没把海底捞搞垮”，如今元气刚刚恢复，他又要动小区的刀；不仅如此，他还要求对员工实行计件工资制度，取消底薪，按件计薪。<\/p>\n<p>这是一个事关海底捞上下几万人饭碗的变革，不解与不满很快从会场蔓延到了海底捞门店——员工不接受，店长推不下去，杭州的一家店里三十多名员工甚至以“集体辞职”相要挟，杨利娟当即下令，将这些人在当天下午3点之前全部开除——这些都是张勇后来才知道的。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a><\/strong><\/p>\n<blockquote>\n<p>2020年4月27日，他以公司内部邮件的方式宣布了接班人计划，里面写道，“近两年，我们四个人（张勇、施永宏、杨利娟、苟轶群）都特別担心，担心我们学习能力跟不上。我们四个人还特别害怕，害怕我们沦为企业发展的绊脚石。”所以他决定在10年到15年内会退休，海底捞要建立起接班人队伍的选拔制度，任何人都可以通过拓展新的工作领域和内部创业积累积分，“我们四个会把积分最高的那批人找出来，长时间观察，择优录取”。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-before\" href=\"#zhang-before-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇是推动海底捞“立法”的人，很多制度创新和组织变革皆出自于他，包括2021年海底捞推行的“啄木鸟”计划。但他对具体的店铺管理却很少插手，在十年甚至更早之前就做了“甩手掌柜”，他自我归因于“太懒”——从小就这样。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明张勇在2011年前后实施分级授权机制，店长、小区经理等有明确签字权额度，黄铁鹰评价其放权力度在民企中少见。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/li>\n<li>研究判断（待人工复核）：该事件发生于2015年海底捞年会，张勇宣布裁撤小区经理并推行计件工资制，属其当时主导的组织变革决策，来源未提及其他主体介入或权责转移。 <a class=\"eid\" data-eid=\"E-PA922054DC5E4DD\" data-side=\"zhang-before\" href=\"#zhang-before-E-PA922054DC5E4DD\">[E-PA922054DC5E4DD]<\/a><\/li>\n<\/ul>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>权责与授权<\/td>\n<td>已取得对应问题的原文线索；主体、时期、适用条件与结论仍待逐项核实。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data d=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇一直敢于向下放权，黄铁鹰曾评价“这种放心大胆的授权在民营企业实属少见”。他在《海底捞你学不会》中记录：100万元以上的签字需要经过张勇，100万元以下是由副总、财务总监和大区经理负责的；大宗采购部长、工程部长和小区经理有30万元的签字权；店长有3万元的签字权。书是在2011年出版的，在那之后，张勇心心念念的一件事，就是进一步给店长“松绑”，让他们成为海底捞最精悍的作战单元。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：出版日期（不代替实施日期）：2011年。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a><\/strong><\/p>\n<p>同一原文已列第4章 <a class=\"eid\" data-eid=\"E-P4C3F3C112C376D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P4C3F3C112C376D\">[E-P4C3F3C112C376D]<\/a>；本章引用该记录，来源与原始定位见第14章。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-PA922054DC5E4DD\" data-side=\"zhang-after\" href=\"#zhang-after-E-PA922054DC5E4DD\">[E-PA922054DC5E4DD]<\/a><\/strong><\/p>\n<blockquote>\n<p>那是2015年海底捞的年会，100多名店长和管理层从全国各地来到三亚，本该是集体庆祝的时候，张勇却给大家当头一棒—— 宣布要全面裁撤小区经理，以减少海底捞的管理层级。他为此酝酿已久——4年前已“砍掉了”大区经理，“差点没把海底捞搞垮”，如今元气刚刚恢复，他又要动小区的刀；不仅如此，他还要求对员工实行计件工资制度，取消底薪，按件计薪。<\/p>\n<p>这是一个事关海底捞上下几万人饭碗的变革，不解与不满很快从会场蔓延到了海底捞门店——员工不接受，店长推不下去，杭州的一家店里三十多名员工甚至以“集体辞职”相要挟，杨利娟当即下令，将这些人在当天下午3点之前全部开除——这些都是张勇后来才知道的。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：组织/管理事项原文日期：2015年。<\/p>\n<p><strong>来源记录 4　张勇 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/strong><\/p>\n<p>同一原文已列第4章 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a>；本章引用该记录，来源与原始定位见第14章。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：2011年出版物载签字权分层：100万元以上须经张勇，100万元以下由副总、财务总监、大区经理负责，店长有3万元签字权，后续是否沿用未载明；研究报告载其任执行董事统筹管理及战略；其自称少插手店铺管理、海外由独立团队管理，并承认无法检查门店。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data 名创始人也悉数回归海底捞，舒萍和施永宏担任公司执行董事，李海燕担任监事。<\/p>\n<\/blockquote>\n<p>来源归属：舒萍；原文事件时间：未披露。\n使用边界：本条主要描述其他人员，不归因目标人物；仅供团队背景核对。<\/p>\n<p><strong>来源记录 2　苟轶群 <a class=\"eid\" data-eid=\"E-P539E9D9D4DE9C0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P539E9D9D4DE9C0\">[E-P539E9D9D4DE9C0]<\/a><\/strong><\/p>\n<blockquote>\n<p>往前回溯，海底捞前两任CEO杨利娟与苟轶群，也是从一线岗位晋升而来——杨利娟从服务员开始一路晋升，苟轶群则从“后勤一线”成长至“管理一线”，此后他们双双进入公司董事会，再由张勇亲自点将，上任CEO。<\/p>\n<\/blockquote>\n<p>来源归属：苟轶群；原文事件时间：未披露。\n使用边界：本条主要描述其他人员，不归因目标人物；仅供团队背景核对。<\/p>\n<p><strong>来源记录 3　周兆呈 <a class=\"eid\" data-eid=\"E-P6FF83F0E2CDD3A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P6FF83F0E2CDD3A\">[E-P6FF83F0E2CDD3A]<\/a><\/strong><\/p>\n<blockquote>\n<p>而对于新开门店的计划，海底捞国际控股非执行董事周兆呈则表示，可以用四个字来概括，就是“谨慎+乐观”。他进一步解释称，海底捞的开店策略是“自下而上”的拓店策略，由在一线的店经理和区域经理自下而上地提报拓店计划，公司根据资源和综合的评价来进行评估。<\/p>\n<\/blockquote>\n<p>来源归属：周兆呈；原文事件时间：未披露。\n使用边界：本条主要描述其他人员，不归因目标人物；仅供团队背景核对。<\/p>\n<h3>团队成员与历史职责线索<\/h3>\n<p>下表汇总本章研究池中的具名成员；职务原词保留来源语境，不认定为现任，其他人员经历不归于目标本人。<\/p>\n<table>\n<thead>\n<tr>\n<th>成员与机构<\/th>\n<th>职务原词（仅合并排版换行）<\/th>\n<th>原文事件日期（非现职任期）<\/th>\n<th>回查编号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>舒萍 / 海底捞<\/td>\n<td>海底捞，舒萍和施永宏担任公司执行董事<\/td>\n<td>原段日期与该成员任期尚未逐项对齐，见原文<\/td>\n<td><a class=\"eid\" data-eid=\"E-P51D7FCEEEC09E2\" data-side=\"zhang-after\" href=\"#zhang-after-E-P51D7FCEEEC09E2\">[E-P51D7FCEEEC09E2]<\/a><\/td>\n<\/tr>\n<tr>\n<td>施永宏 / 海底捞<\/td>\n<td>海底捞，舒萍和施永宏担任公司执行董事<\/td>\n<td>原段日期与该成员任期尚未逐项对齐，见原文<\/td>\n<td><a class=\"eid\" data-eid=\"E-PAB6B86DBFF419B\" data-side=\"zhang-after\" href=\"#zhang-after-E-PAB6B86DBFF419B\">[E-PAB6B86DBFF419B]<\/a><\/td>\n<\/tr>\n<tr>\n<td>李海燕 / 海底捞<\/td>\n<td>海底捞，舒萍和施永宏担任公司执行董事，李海燕担任监事<\/td>\n<td>原段日期与该成员任期尚未逐项对齐，见原文<\/td>\n<td><a class=\"eid\" data-eid=\"E-PB13A6714932954\" data-side=\"zhang-after\" href=\"#zhang-after-E-PB13A6714932954\">[E-PB13A6714932954]<\/a><\/td>\n<\/tr>\n<tr>\n<td>苟轶群 / 海底捞<\/td>\n<td>海底捞前两任CEO杨利娟与苟轶群；海底捞发布公告称，因服务于公司战略发展的董事会组成及角色调整，即日起，苟轶群辞任公司执行董事及首席执行官<\/td>\n<td>原段日期与该成员任期尚未逐项对齐 0C51228B02967]<\/a> <a class=\"eid\" data-eid=\"E-PD97BA004BEB975\" data-side=\"zhang-after\" href=\"#zhang-after-E-PD97BA004BEB975\">[E-PD97BA004BEB975]<\/a> <a class=\"eid\" data-eid=\"E-P646F3D25C9D721\" data-side=\"zhang-after\" href=\"#zhang-after-E-P646F3D25C9D721\">[E-P646F3D25C9D721]<\/a><\/li>\n<\/ul>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n", "before_chars": 3686, "after_chars": 1839, "note": "繁简姓名仅在比较时归一，年报课程记录已进入88条专项研究池；正文保留2011年10月及2012年8月完成课程。债务经历未当司法事项，弟弟和儿子事项仍归关联方。"}, {"n": 11, "title": "投后治理及退出风险研判", "before": "<h2>11. 投后治理及退出风险研判<\/h2>\n<p>本章列示决策权限、治理和退出安排，区分拟议条款与已披露的生效事项。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/strong><\/p>\n<blockquote>\n<p>张勇一直敢于向下放权，黄铁鹰曾评价“这种放心大胆的授权在民营企业实属少见”。他在《海底捞你学不会》中记录：100万元以上的签字需要经过张勇，100万元以下是由副总、财务总监和大区经理负责的；大宗采购部长、工程部长和小区经理有30万元的签字权；店长有3万元的签字权。书是在2011年出版的，在那之后，张勇心心念念的一件事，就是进一步给店长“松绑”，让他们成为海底捞最精悍的作战单元。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a><\/strong><\/p>\n<blockquote>\n<p>2020年4月27日，他以公司内部邮件的方式宣布了接班人计划，里面写道，“近两年，我们四个人（张勇、施永宏、杨利娟、苟轶群）都特別担心，担心我们学习能力跟不上。我们四个人还特别害怕，害怕我们沦为企业发展的绊脚石。”所以他决定在10年到15年内会退休，海底捞要建立起接班人队伍的选拔制度，任何人都可以通过拓展新的工作领域和内部创业积累积分，“我们四个会把积分最高的那批人找出来，长时间观察，择优录取”。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 3　张勇 <a class=\"eid\" data-eid=\"E-PD27CA928B6F795\" data-side=\"zhang-before\" href=\"#zhang-before-E-PD27CA928B6F795\">[E-PD27CA928B6F795]<\/a><\/strong><\/p>\n<blockquote>\n<p>2024年4月26日 --- PDF page 3 local OCR transcription pending visual review --- 義 於本通函内，除文義另有所指外，下列具有以下涵義： 「股東年大會」 指 本公司謹訂於2024年6月5日（星期三）上午十時正在 中國北京市西城區廣安門外大街168號北京希爾顿逸 林酒店以實體形式行的股東调年大會或其任何續 會，其通告载於本通函第23至30页 「組織章程細则」 指 本公司的組織章程細则(經不時修訂) 「聯繁人」 指 具有上市规则赋予該的相同涵義 >来源记录 7　张勇 <a class=\"eid\" data-eid=\"E-PF8797F7801B4BC\" data-side=\"zhang-before\" href=\"#zhang-before-E-PF8797F7801B4BC\">[E-PF8797F7801B4BC]<\/a><\/strong><\/p>\n<blockquote>\n<p>2018年，海底捞在港交所上市，张勇担任公司首席执行官，后于2022年3月卸任。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 8　张勇 <a class=\"eid\" data-eid=\"E-P9B2864180BD442\" data-side=\"zhang-before\" href=\"#zhang-before-E-P9B2864180BD442\">[E-P9B2864180BD442]<\/a><\/strong><\/p>\n<blockquote>\n<p>随着海底捞赴港上市，张勇夫妇的个人财富也将快速增长，目前张勇、舒萍夫妇持有海底捞62.7%股份。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。\n权益披露主体：张勇夫妇；不等同目标人物单独持有。<\/p>\n<p><strong>来源记录 9　张勇 <a class=\"eid\" data-eid=\"E-P0576A54BBCFA5A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P0576A54BBCFA5A\">[E-P0576A54BBCFA5A]<\/a><\/strong><\/p>\n<blockquote>\n<p>根据《餐企老板内参》报道，一位接近海底捞的人士表示，“张勇回归有助于提升董事会决策意图在执行层面的传导效率。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 10　张勇 <a class=\"eid\" data-eid=\"E-PC3ABD1ABFC153E\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC3ABD1ABFC153E\">[E-PC3ABD1ABFC153E]<\/a><\/strong><\/p>\n<blockquote>\n<p>格隆汇5月22日｜海底捞(6862.HK)：控股股东、董事会主席兼首席执行官张勇在5月21-22日增持1135万股股份。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 11　张勇 <a class=\"eid\" data-eid=\"E-P3E37D5D58B06E1\" data-side=\"zhang-before\" href=\"#zhang-before-E-P3E37D5D58B06E1\">[E-P3E37D5D58B06E1]<\/a><\/strong><\/p>\n<blockquote>\n<p>然而，作为公司创始人，张勇的决策从后来看无疑是正确的，因为海底捞要想成为一个现代化的企业，就必须解决家族企业天花板的问题。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 12　张勇 <a class=\"eid\" data-eid=\"E-P6D0C2105D46F24\" data-side=\"zhang-before\" href=\"#zhang-before-E-P6D0C2105D46F24\">[E-P6D0C2105D46F24]<\/a><\/strong><\/p>\n<blockquote>\n<p>2020年，张勇在内部信提到自己将在10至15年内退休，所有员工都有机会参与领导者接班计划，但他表示， “（施永宏、苟轶群、杨利娟）太贵了，对未来的董事会来讲，性价比不高。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源披露张勇于2020年4月宣布10–15年退休计划及接班人积分制，同时称原核心成员‘性价比不高’，反映其对治理代际过渡的主动设计，但未说明制度落地进展。 <a class=\"eid\" data-eid=\ <td>不评分<\/td>\n<\/tr>\n<tr>\n<td>婚变风险<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>诉讼纠纷及舆情监管<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>背景与职业转换相关核验<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "after": "<h2>12. 风险核查<\/h2>\n<p>本章区分直接信号、关联主体信号和查询覆盖；未查到、失败及未查询分别记录。<\/p>\n<h3>已检索事实与来源边界<\/h3>\n<p>以下均为来源陈述，尚未经独立真实性核验；评价不等于事实，承诺不等于已履行。<\/p>\n<p><strong>来源记录 1　张勇 <a class=\"eid\" data-eid=\"E-PDE4A2EBAEF1C38\" data-side=\"zhang-after\" href=\"#zhang-after-E-PDE4A2EBAEF1C38\">[E-PDE4A2EBAEF1C38]<\/a><\/strong><\/p>\n<blockquote>\n<p>危机感很大程度上来自于张勇，即便在海底捞最鼎盛时期，他常说的也是“未来十年我们会怎么死”。因此过去很多年来，海底捞一直在做“死亡演练”，模拟当食品安全、外部市场、内部管理等各种危机出现时要如何应对。这就像持续打入的疫苗一样，让海底捞体内多少也生成了抵御风险的“抗体”；而每年都觉得“很难”的杨利娟也渐渐没有那么“焦虑”了，像张勇嘱咐的那样，“不能乱了分寸”。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：未披露。<\/p>\n<p><strong>来源记录 2　张勇 <a class=\"eid\" data-eid=\"E-P380C8D3678E7DA\" data-side=\"zhang-after\" href=\"#zhang-after-E-P380C8D3678E7DA\">[E-P380C8D3678E7DA]<\/a><\/strong><\/p>\n<blockquote>\n<p>曾建议海尔去掉科层组织的凯文·凯利在《失控》一书中同时指出了可能的风险：自我进化有着天然野性的力量，甚至可能超出创造者的预期。有人说“成也师徒制，败也师徒制”，这可能有一些偏颇， 但成为“动车组”的海底捞跑的太快了，也确实让张勇感到不安。在2018年上市前夕，张勇接受《中国企业家》专访时坦言：“未来最大挑战还是海底捞太快了。” 但他也矛盾，“那么多人想当店长，而且又合格，又有市场、生意又好，你有什么理由反对呢？”现在看起来，后一种想法占了上风，海底捞不仅没有减速，反而在大幅提速：2018年、2019年、2020年的新开店数分别为200家、308家、544家。<\/p>\n<\/blockquote>\n<p>来源归属：张勇；原文事件时间：原文日期词：2018年、2019年、2020年（日期归属及适用事项待核实）。<\/p>\n<h3>本章研究覆盖与核验问题<\/h3>\n<p>共同核验边界：已记录4项专业查询状态，逐项区分返回记录、空结果、失败及未查询；不作为无风险证明。<\/p>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>已发现的直接信号<\/td>\n<td>已取得对应归属的来源信号；事项性质、个人责任和处理结果仍需核实。 <a class=\"eid\" data-eid=\"E-PDE4A2EBAEF1C38\" data-side=\"zhang-after\" href=\"#zhang-after-E-PDE4A2EBAEF1C38\">[E-PDE4A2EBAEF1C38]<\/a> <a class=\"eid\" data-eid=\"E-P380C8D3678E7DA\" data-side=\"zhang-after\" href=\"#zhang-after-E-P380C8D3678E7DA\">[E-P380C8D3678E7DA]<\/a><\/td>\n<\/tr>\n<tr>\n<td>关联主体间接信号<\/td>\n<td>当前入选材料尚不能回答该问题，需核查留存原文或有针对性补证。<\/td>\n<\/tr>\n<tr>\n<td>尚未核验及未查询事项<\/td>\n<td>共同边界见上<\/td>\n<\/tr>\n<tr>\n<td>风险核查覆盖清单<\/td>\n<td>共同边界见上<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>专业查询覆盖与返回边界<\/h3>\n<p>查询状态不构成个人无风险结论；记录只描述该工具、定位输入及返回范围。定位机构不代表关联已经确认；留存清单中的历史候选仍保留原查询状态。<\/p>\n<table>\n<thead>\n<tr>\n<th>平台<\/th>\n<th>定位主体<\/th>\n<th>查询项<\/th>\n<th>本次状态<\/th>\n<th>限制或原因<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>qcc<\/td>\n<td>海底捞国际控股有限公司<\/td>\n<td>风险线索扫描；失信被执行记录；被执行记录；裁判文书<\/td>\n<td>尚未查询<\/td>\n<td>平台返回地域或访问限制，并非无记录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本章仍有未核验事项，已集中列入第15章。<\/p>\n<h3>风险核查覆盖清单<\/h3>\n<table>\n<thead>\n<tr>\n<th>核查维度<\/th>\n<th>当前状态<\/th>\n<th>风险分<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>经验不足<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>业务能力局限<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>战略能力<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>管理能力局限<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>驱动力不足<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>资源局限<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>贪腐<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>创业目的不纯<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>个人道德问题<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>商业信誉度低<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>不良嗜好<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>为人处世风格问题<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>奢侈消费观<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>个人健康风险<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>婚变风险<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>诉讼纠纷及舆情监管<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<tr>\n<td>背景与职业转换相关核验<\/td>\n<td>仅据上述来源逐项核验，未核验不代表无风险<\/td>\n<td>不评分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "before_chars": 1550, "after_chars": 1987, "note": "危机意识、扩店风险及平台查询覆盖分开，未据此判定个人失信或违法；未查询与无记录保持区别。"}, {"n": 13, "title": "综合评估", "before": "<h2>13. 综合评估<\/h2>\n<p>本章汇总正文已有的研究判断与决策所需材料，风险程度和证据充分程度分别说明。<\/p>\n<p>正文来源回查：<a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-P3B9E7CA7487BD9\" data-side=\"zhang-before\" href=\"#zhang-before-E-P3B9E7CA7487BD9\">[E-P3B9E7CA7487BD9]<\/a> <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-P06DE04281E0C04\" data-side=\"zhang-before\" href=\"#zhang-before-E-P06DE04281E0C04\">[E-P06DE04281E0C04]<\/a> <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-before\" href=\"#zhang-before-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-P796DB84FA6879C\" data-side=\"zhang-before\" href=\"#zhang-before-E-P796DB84FA6879C\">[E-P796DB84FA6879C]<\/a> <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a> <a class=\"eid\" data-eid=\"E-PB23B2122A86F35\" data-side=\"zhang-before\" href=\"#zhang-before-E-PB23B2122A86F35\">[E-PB23B2122A86F35]<\/a><\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：来源载明张勇1988年技校毕业，同年进入四川拖拉机厂任电焊工；两处记载一致，但未说明技校名称、专业及拖拉机厂具体职务层级。 <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-before\" href=\"#zhang-before-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a> <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-before\" href=\"#zhang-before-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称张勇回归一线可“校准战略、缩短试错周期”“带领走出转型迷雾”，属预期性表述，未提供已发生的可验证经营结果或迭代成效。 <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-before\" href=\"#zhang-before-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-PC3DE4558777540\" data-side=\"zhang-before\" href=\"#zhang-before-E-PC3DE4558777540\">[E-PC3DE4558777540]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明张勇在2011年前后实施分级授权机制，店长、小区经理等有明确签字权额度，黄铁鹰评价其放权力度在民企中少见。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-before\" href=\"#zhang-before-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明张勇当前持股33.64亿股、占比37.35%，但未披露基准日，无法确认是否为最新时点数据。 <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-before\" href=\"#zhang-before-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a><\/li>\n<li>研究判断（待人工复核）：来源披露张勇于2020年4月宣布10–15年退休计划及接班人积分制，同时称原核心成员‘性价比不高’，反映其对治理代际过渡的主动设计，但未说明制度落地进展。 <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-before\" href=\"#zhang-before-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a> <a class=\"eid\" data-eid=\"E-P6D0C2105D46F24\" data-side=\"zhang-before\" href=\"#zhang-before-E-P6D0C2105D46F24\">[E-P6D0C2105D46F24]<\/a><\/li>\n<\/ul>\n<h3>综合判断与证据充分程度<\/h3>\n<p>未建立经人工认可的量表，不自动给出A/B或数值评分。已引用材料为研究底稿；事实冲突、个人归属与信息缺口见第15章。<\/p>\n<h3>本章研究覆盖与核验问题<\/h3>\n<table>\n<thead>\n<tr>\n<th>研究维度<\/th>\n<th>当前证据边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>已获来源支持的发现<\/td>\n<td>仅汇总正文已有来源陈述，观点和单方争议不作为确定发现。<\/td>\n<\/tr>\n<tr>\n<td>关键局限及冲突<\/td>\n<td>正文仍有47项待核验或缺证说明，具体材料和行动见第15章。<\/td>\n<\/tr>\n<tr>\n<td>风险与证据充分程度<\/td>\n<td>风险信号与证据充分程度分别记录；未核验不代表无风险。<\/td>\n<\/tr>\n<tr>\n<td>下一步决策所需材料<\/td>\n<td>按第15章逐项补原件、核对时期和归属，并完成Word视觉验收。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "after": "<h2>13. 综合评估<\/h2>\n<p>本章汇总正文已有的研究判断与决策所需材料，风险程度和证据充分程度分别说明。<\/p>\n<p>正文来源回查：<a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-P8E846B3936243A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P8E846B3936243A\">[E-P8E846B3936243A]<\/a> <a class=\"eid\" data-eid=\"E-P2F6F9CEEC5743A\" data-side=\"zhang-after\" href=\"#zhang-after-E-P2F6F9CEEC5743A\">[E-P2F6F9CEEC5743A]<\/a> <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-P51D7FCEEEC09E2\" data-side=\"zhang-after\" href=\"#zhang-after-E-P51D7FCEEEC09E2\">[E-P51D7FCEEEC09E2]<\/a> <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-PD27CA928B6F795\" data-side=\"zhang-after\" href=\"#zhang-after-E-PD27CA928B6F795\">[E-PD27CA928B6F795]<\/a> <a class=\"eid\" data-eid=\"E-P5B5763E4D93E6D\" data-side=\"zhang-after\" href=\"#zhang-after-E-P5B5763E4D93E6D\">[E-P5B5763E4D93E6D]<\/a><\/p>\n<h3>基于上述材料的初步分析<\/h3>\n<ul>\n<li>研究判断（待人工复核）：公开资料称张勇生于1971年；1988年技校毕业后进入四川拖拉机厂，另有来源称回简阳任电焊工，首份工作表述不同；1994年3月张勇夫妇与施永宏、李海燕夫妇创办海底捞。 <a class=\"eid\" data-eid=\"E-P7DD3858C9DAFFE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P7DD3858C9DAFFE\">[E-P7DD3858C9DAFFE]<\/a> <a class=\"eid\" data-eid=\"E-PFA9F64D96A15A5\" data-side=\"zhang-after\" href=\"#zhang-after-E-PFA9F64D96A15A5\">[E-PFA9F64D96A15A5]<\/a> <a class=\"eid\" data-eid=\"E-PE30F10D02C1646\" data-side=\"zhang-after\" href=\"#zhang-after-E-PE30F10D02C1646\">[E-PE30F10D02C1646]<\/a> <a class=\"eid\" data-eid=\"E-PC518FB14D6C40E\" data-side=\"zhang-after\" href=\"#zhang-after-E-PC518FB14D6C40E\">[E-PC518FB14D6C40E]<\/a> <a class=\"eid\" data-eid=\"E-P84060BD57E289E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P84060BD57E289E\">[E-P84060BD57E289E]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称张勇推动海底捞“立法”，多项制度创新和组织变革出自其手，包括2021年“啄木鸟”计划；同时称其很少插手具体店铺管理。 <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a><\/li>\n<li>研究判断（待人工复核）：2011年出版物载签字权分层：100万元以上须经张勇，100万元以下由副总、财务总监、大区经理负责，店长有3万元签字权，后续是否沿用未载明；研究报告载其任执行董事统筹管理及战略；其自称少插手店铺管理、海外由独立团队管理，并承认无法检查门店。 <a class=\"eid\" data-eid=\"E-P779AA95AD748A0\" data-side=\"zhang-after\" href=\"#zhang-after-E-P779AA95AD748A0\">[E-P779AA95AD748A0]<\/a> <a class=\"eid\" data-eid=\"E-PED11AE249D87ED\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED11AE249D87ED\">[E-PED11AE249D87ED]<\/a> <a class=\"eid\" data-eid=\"E-PED2349EB855EF4\" data-side=\"zhang-after\" href=\"#zhang-after-E-PED2349EB855EF4\">[E-PED2349EB855EF4]<\/a> <a class=\"eid\" data-eid=\"E-P99F43CB3B9840E\" data-side=\"zhang-after\" href=\"#zhang-after-E-P99F43CB3B9840E\">[E-P99F43CB3B9840E]<\/a> <a class=\"eid\" data-eid=\"E-P52F1C780680F25\" data-side=\"zhang-after\" href=\"#zhang-after-E-P52F1C780680F25\">[E-P52F1C780680F25]<\/a><\/li>\n<li>研究判断（待人工复核）：来源称张勇持33.64亿股、占37.35%，但未载基准日；另讯载20.82亿股、约37.36%，研报载其个人拥有44.01%权益。2007年受让施永宏夫妇18%股权后，张勇夫妇持68%，仅称按原始出资额。 <a class=\"eid\" data-eid=\"E-P78B30ED07BE0FE\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78B30ED07BE0FE\">[E-P78B30ED07BE0FE]<\/a> <a class=\"eid\" data-eid=\"E-P083F09DDECAA63\" data-side=\"zhang-after\" href=\"#zhang-after-E-P083F09DDECAA63\">[E-P083F09DDECAA63]<\/a> <a class=\"eid\" data-eid=\"E-PABB44EDE9176D9\" data-side=\"zhang-after\" href=\"#zhang-after-E-PABB44EDE9176D9\">[E-PABB44EDE9176D9]<\/a> <a class=\"eid\" data-eid=\"E-P78265637F5E87B\" data-side=\"zhang-after\" href=\"#zhang-after-E-P78265637F5E87B\">[E-P78265637F5E87B]<\/a> <a class=\"eid\" data-eid=\"E-P249FD1EF4660A7\" data-side=\"zhang-after\" href=\"#zhang-after-E-P249FD1EF4660A7\">[E-P249FD1EF4660A7]<\/a><\/li>\n<li>研究判断（待人工复核）：来源载明拟12个月内以自有资金增持不少于1亿元（起始日“10日”，年月未明），5月21-22日增持1135万股（年份未明），持股20.82亿股约占37.36%（基准日未载明）。未见投资协议、退出权或减持安排；增持不构成退出。 <a class=\"eid\" data-eid=\"E-P796DB84FA6879C\" data-side=\"zhang-after\" href=\"#zhang-after-E-P796DB84FA6879C\">[E-P796DB84FA6879C]<\/a> <a class=\"eid\" data-eid=\"E-P083F09DDECAA63\" data-side=\"zhang-after\" href=\"#zhang-after-E-P083F09DDECAA63\">[E-P083F09DDECAA63]<\/a> <a class=\"eid\" data-eid
